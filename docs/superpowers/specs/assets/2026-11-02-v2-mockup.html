<!doctype html>
<html lang="en" data-motion="on" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundBettr home mockup</title>
<meta name="description" content="Mockup of the SoundBettr home screen on phone and Windows, showing the connect sequence and spoken announcement.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Hallmark · shape: app screen · style: pastel-consumer (taste draw, seed 1530765030) · light · signature: the device card that recognizes, colors and speaks */
/* critique: one focal card per screen, per-device hue as identity, motion only on real state changes */
/* Hallmark · waive 24b · rail padding 6px · centres 52px items in a 64px rail */
:root {
  --ground: #f3f5f7;
  --surface: #fcfdff;
  --raised: #f2f8fd;
  --rule: #e6e8eb;
  --control: #d6d9dd;
  --text: #1b1d1f;
  --muted: #5c6064;
  --accent: #1d5fd6;
  --positive: #2f7a45;
  --neutral-soft: #eef1f4;
  --neutral-ink: #3a3d40;
  --focus: #1d5fd6;
  --negative: #c41c29;
  --pill-accent-bg: #dcf1ff; --pill-accent-ink: #0a3a80;
  --scrim: rgb(15 17 19 / .45);
  --jade-soft: #d6f3e4;   --jade-ink: #0b4a2c;   --jade-mark: #1f8a52;
  /* device hues, each at least 60 degrees from the next */
  --cobalt-soft: #dcf1ff; --cobalt-ink: #0a3a80; --cobalt-mark: #1d5fd6;
  --amber-soft: #fdecd2;  --amber-ink: #6b3206;  --amber-mark: #b45309;
  --rose-soft: #fbe1ee;   --rose-ink: #6e1240;   --rose-mark: #b8326f;
  --font: "Manrope", system-ui, sans-serif;
  --radius-card: 20px;
  --radius-inner: 10px;
  --radius-small: 8px;
  --gap: 16px;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-spring: cubic-bezier(.34, 1.4, .64, 1);
}
/* dark: elevation by lightness, device hues kept but deepened so their ink stays readable */
html[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0f1113;
  --surface: #181b1e;
  --raised: #1e2226;
  --rule: #262a2e;
  --control: #3a3f45;
  --text: #eceef0;
  --muted: #a3a8ae;
  --accent: #6aa5ff;
  --positive: #6fcf8e;
  --neutral-soft: #22262a;
  --neutral-ink: #c9cdd2;
  --focus: #6aa5ff;
  --negative: #ff8a8a;
  --pill-accent-bg: #142a4a; --pill-accent-ink: #d3e6ff;
  --scrim: rgb(0 0 0 / .6);
  --jade-soft: #12321f;   --jade-ink: #c9f1db;   --jade-mark: #5fd08f;
  --cobalt-soft: #142a4a; --cobalt-ink: #d3e6ff; --cobalt-mark: #6aa5ff;
  --amber-soft: #3a2610;  --amber-ink: #fbe0bd;  --amber-mark: #f0a04b;
  --rose-soft: #3d1628;   --rose-ink: #fad3e5;   --rose-mark: #f07aae;
}
* { box-sizing: border-box; }
body { transition: background-color .3s, color .3s; }
html, body { overflow-x: clip; }
body { font-variant-numeric: tabular-nums; margin: 0; background: var(--ground); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; transition: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* board around the two artboards */
.board-head { max-width: 1440px; margin: 0 auto; padding: 32px 24px 8px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between; }
.board-head h1 { text-wrap: balance; margin: 0; font-size: 28px; font-weight: 600; line-height: 1.15; overflow-wrap: break-word; min-width: 0; }
.board-head p { margin: 8px 0 0; color: var(--muted); max-width: 52ch; }
.board-tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tool { min-height: 44px; padding: 0 16px; border: 1px solid var(--control); border-radius: var(--radius-inner); background: var(--surface); }
.tool:hover { background: var(--raised); }
.tool:active { transform: scale(.97); }
.tool[aria-pressed="false"] { color: var(--muted); }
.boards { max-width: 1440px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 390px minmax(0, 1fr); gap: 32px; align-items: start; }
.artboard h2 { font-size: 14px; font-weight: 500; color: var(--muted); margin: 0 0 8px; }
.frame { border-radius: 28px; background: var(--ground); outline: 1px solid var(--rule); overflow: clip; }
.frame.phone { width: 390px; height: 800px; }
.frame.desk { height: 800px; border-radius: 14px; }
@media (max-width: 1000px) { .boards { grid-template-columns: minmax(0, 1fr); } .frame.phone { width: min(390px, 100%); } }

/* the app, responsive by container width */
.app { container-type: inline-size; height: 100%; position: relative; }
.shell { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.screen { grid-row: 1; overflow-y: auto; padding: 20px 16px 24px; }
.view { display: none; }
.view.on { display: block; animation: view-in .32s var(--ease-out); }
@keyframes view-in { from { opacity: 0; transform: translateY(8px); } }

.route { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
.cols { display: grid; gap: var(--gap); }

/* nav: bottom bar on phone, rail on desktop */
.nav { grid-row: 2; position: relative; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--rule); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
.nav .brand { display: none; }
.nav-btn { position: relative; z-index: 1; min-height: 52px; border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 12px; color: var(--muted); border-radius: 14px; }
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn:hover { color: var(--text); }
.nav-btn:active svg { transform: scale(.9); }
.nav-btn[aria-current="page"] { color: var(--dev-ink, var(--text)); font-weight: 600; }
.nav-ind { position: absolute; z-index: 0; top: 8px; left: 0; height: 52px; border-radius: 14px; background: var(--dev-soft, var(--neutral-soft)); transition: transform .38s var(--ease-spring), background-color .5s var(--ease-out); }
svg.i { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* device card: the focal point */
.device { --ring: var(--control); background: var(--neutral-soft); color: var(--neutral-ink); border-radius: var(--radius-card); padding: 4px; transition: background-color .6s var(--ease-out), color .6s var(--ease-out); }
.app[data-state="ready"] .device { background: var(--dev-soft); color: var(--dev-ink); --ring: var(--dev-mark); }
.device-btn { width: 100%; min-height: 112px; border: 0; background: none; border-radius: 16px; padding: 16px; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 16px; align-items: center; text-align: left; color: inherit; }
.device-btn:hover { background: color-mix(in srgb, var(--surface) 35%, transparent); }
.device-btn:active { transform: scale(.985); }
.mark { position: relative; width: 76px; height: 76px; display: grid; place-items: center; }
.mark .core { width: 56px; height: 56px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--ring); transition: color .5s; }
.mark .core svg { width: 28px; height: 28px; }
.mark .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--ring); opacity: 0; }
.app[data-state="searching"] .ring { animation: ring 1.6s var(--ease-out) infinite; }
.app[data-state="searching"] .ring:nth-child(2) { animation-delay: .53s; }
.app[data-state="searching"] .ring:nth-child(3) { animation-delay: 1.06s; }
@keyframes ring { from { transform: scale(.7); opacity: .8; } to { transform: scale(1.35); opacity: 0; } }
.app[data-state="ready"] .core { animation: lock .7s var(--ease-spring); }
@keyframes lock { 0% { transform: scale(.75); } 100% { transform: scale(1); } }
.app[data-state="ready"] .ring:nth-child(1) { animation: lock-ring .8s var(--ease-out); }
@keyframes lock-ring { from { transform: scale(1.4); opacity: 0; } 50% { opacity: .9; } to { transform: scale(1); opacity: 0; } }
.device-name { display: block; font-size: 22px; font-weight: 600; line-height: 1.2; overflow-wrap: break-word; }
.device-state { text-wrap: balance; display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 14px; }
.app[data-state="ready"] .device-text { animation: rise .5s .1s var(--ease-out) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.bars { display: none; gap: 4px; align-items: end; height: 14px; }
.app[data-speaking="true"] .bars { display: inline-flex; }
.bars i { width: 3px; height: 14px; border-radius: 2px; background: currentColor; transform-origin: bottom; animation: bar .7s ease-in-out infinite alternate; }
.bars i:nth-child(2) { animation-delay: .2s; } .bars i:nth-child(3) { animation-delay: .4s; }
@keyframes bar { from { transform: scaleY(.25); } to { transform: scaleY(1); } }

.battery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 0 16px 16px; }
.batt { background: var(--surface); color: var(--text); border-radius: var(--radius-inner); padding: 8px 12px; font-size: 14px; }
.batt b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 3px; background: var(--neutral-soft); margin-top: 8px; overflow: clip; }
.meter i { display: block; height: 100%; width: 100%; background: var(--dev-mark, var(--control)); border-radius: 3px; transform-origin: left; transform: scaleX(var(--v, 0)); transition: transform .9s .35s var(--ease-out), background-color .5s; }
.battery-none { grid-column: 1 / -1; background: var(--surface); color: var(--muted); border-radius: var(--radius-inner); padding: 8px 12px; font-size: 14px; }
.app[data-state="searching"] .battery { visibility: hidden; }

/* white panels */
.card { background: var(--surface); border-radius: var(--radius-card); padding: 20px; }
.card h2 { margin: 0; font-size: 16px; font-weight: 500; color: var(--muted); }
.profile { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-top: 8px; }
.profile-name { font-size: 24px; font-weight: 600; line-height: 1.2; }
.profile-note { font-size: 14px; color: var(--muted); }
.link-btn { min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-inner); background: var(--dev-soft, var(--neutral-soft)); color: var(--dev-ink, var(--text)); font-weight: 600; transition: background-color .5s; flex: none; }
.link-btn:hover { filter: brightness(.97); }
.link-btn:active { transform: scale(.97); }
.curve { display: block; width: 100%; height: 96px; margin-top: 12px; }
.curve .zero { stroke: var(--rule); stroke-width: 1; }
.curve .line { fill: none; stroke: var(--dev-mark, var(--control)); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; transition: stroke .5s; }
.app[data-state="ready"] [data-view="now"] .curve .line { animation: draw 1.1s .3s var(--ease-out) both; }
@keyframes draw { from { stroke-dashoffset: 1; } }
.axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.balance { margin-top: 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 14px; color: var(--muted); }
.track { position: relative; height: 6px; border-radius: 3px; background: var(--neutral-soft); }
.track i { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--dev-mark, var(--control)); transform: translateX(var(--bal, 0)); transition: transform .8s .4s var(--ease-spring), background-color .5s; }
.balance-val { margin-top: 4px; font-size: 14px; color: var(--muted); }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 12px; background: var(--neutral-soft); border-radius: 12px; padding: 4px; position: relative; }
.seg button { position: relative; z-index: 1; min-height: 44px; border: 0; background: none; border-radius: 9px; font-size: 14px; color: var(--muted); }
.seg button[aria-checked="true"] { color: var(--text); font-weight: 600; }
.seg .seg-ind { position: absolute; z-index: 0; top: 4px; left: 4px; height: 44px; border-radius: 9px; background: var(--surface); transition: transform .35s var(--ease-spring); }
.hw-note { margin: 12px 0 0; font-size: 14px; color: var(--muted); }

.devlist { list-style: none; margin: 8px 0 0; padding: 0; }
.devrow { width: 100%; min-height: 64px; border: 0; background: none; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; border-radius: 12px; padding: 8px; }
.devrow:hover { background: var(--ground); }
.devrow .tile { width: 40px; height: 40px; border-radius: var(--radius-small); display: grid; place-items: center; }
.devrow .tile { font-weight: 600; font-size: 16px; }
.devrow strong { display: block; font-weight: 600; font-size: 15px; }
.devrow span { font-size: 14px; color: var(--muted); }
.devrow .now { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--neutral-soft); color: var(--neutral-ink); }

.stub h1 { margin: 0; font-size: 24px; font-weight: 600; }
.stub p { color: var(--muted); max-width: 40ch; }

/* settings: label column beside a panel on desktop, stacked on phone */
.page-title { margin: 0 0 8px; font-size: 24px; font-weight: 600; line-height: 1.2; }
.set-row { display: grid; gap: 12px; padding: 20px 0; }
.set-row + .set-row { border-top: 1px solid var(--rule); }
.set-label h2 { margin: 0; font-size: 16px; font-weight: 600; }
.set-label p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.set-panel { background: var(--surface); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
.set-panel .seg { margin-top: 0; }
.switch-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; }
.switch-row strong { display: block; font-weight: 500; }
.switch-row small { font-size: 14px; color: var(--muted); }
.switch { appearance: none; flex: none; width: 44px; height: 28px; margin: 0; border-radius: 14px; background: var(--control); position: relative; cursor: pointer; transition: background-color .2s; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: transform .25s var(--ease-out); }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(16px); }
.engine-note { margin: 0; font-size: 14px; color: var(--muted); }
.voices { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.voice { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; border-radius: 12px; padding: 4px 4px 4px 12px; transition: background-color .25s; }
.voice:hover { background: var(--ground); }
.voice[aria-current="true"] { background: var(--dev-soft, var(--neutral-soft)); color: var(--dev-ink, var(--text)); }
.voice-pick { border: 0; background: none; text-align: left; min-height: 44px; padding: 0; color: inherit; }
.voice-pick strong { display: block; font-weight: 600; font-size: 15px; }
.voice-pick span { font-size: 13px; color: var(--muted); }
.voice[aria-current="true"] .voice-pick span { color: inherit; }
.play-btn { min-width: 64px; min-height: 44px; border: 0; border-radius: var(--radius-inner); background: var(--neutral-soft); font-size: 14px; font-weight: 600; }
.play-btn:hover { background: var(--control); }
.play-btn:active { transform: scale(.96); }
.field-label { font-size: 14px; font-weight: 500; }
.field { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--control); border-radius: var(--radius-inner); background: var(--surface); color: var(--text); font: inherit; }

/* shared page parts for Devices, Tune, Tests */
.page-head { margin-bottom: 16px; }
.page-head p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.split { display: grid; gap: var(--gap); align-items: start; }
.stack { display: grid; gap: var(--gap); }
.muted { font-size: 14px; color: var(--muted); margin: 0; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.btn { min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-inner); background: var(--neutral-soft); font-size: 14px; font-weight: 600; }
.btn:hover { background: var(--control); }
.btn:active { transform: scale(.97); }
.btn:disabled, .btn.primary:disabled { background: var(--neutral-soft); color: var(--muted); cursor: not-allowed; filter: none; }
.btn.primary { background: var(--dev-mark, var(--accent)); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--negative); }
.dev-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 12px; background: var(--dev-soft, var(--neutral-soft)); color: var(--dev-ink, var(--text)); font-size: 14px; font-weight: 600; }
.dev-chip b { width: 32px; height: 32px; border-radius: var(--radius-small); display: grid; place-items: center; background: var(--surface); }
.dev-chip svg { width: 18px; height: 18px; }
.card h3 { margin: 16px 0 4px; font-size: 15px; font-weight: 600; }

/* devices */
.devrow[aria-current="true"] { background: var(--ground); }
.new-tag { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--pill-accent-bg); color: var(--pill-accent-ink); }
.swatches { display: flex; gap: 8px; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 2px solid transparent; display: grid; place-items: center; }

.swatch[aria-checked="true"] { outline: 3px solid currentColor; outline-offset: 3px; }
.detail { display: grid; gap: 12px; }
.detail h2 { color: var(--text); font-size: 20px; font-weight: 600; }
.setup-card { background: var(--pill-accent-bg); color: var(--pill-accent-ink); border-radius: var(--radius-card); padding: 16px 20px; display: grid; gap: 8px; animation: rise .45s var(--ease-out); }
.setup-card strong { font-size: 17px; }
.setup-card[hidden] { display: none; }
dialog { border: 0; border-radius: var(--radius-card); background: var(--surface); color: var(--text); padding: 20px; max-width: 340px; }
dialog::backdrop { background: var(--scrim); }
dialog h2 { margin: 0 0 8px; font-size: 18px; }

/* tune */
.eq { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
.band { display: grid; justify-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.band input { writing-mode: vertical-lr; direction: rtl; width: 32px; height: 132px; margin: 0; accent-color: var(--dev-mark, var(--accent)); cursor: pointer; }
.band output { color: var(--text); font-variant-numeric: tabular-nums; }
.range { width: 100%; min-height: 44px; margin: 0; accent-color: var(--dev-mark, var(--accent)); cursor: pointer; }
.results { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.result { width: 100%; min-height: 52px; border: 0; background: none; border-radius: 12px; padding: 8px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; }
.result:hover { background: var(--ground); }
.result small { display: block; font-size: 13px; color: var(--muted); }
.result em { font-style: normal; font-size: 14px; font-weight: 600; color: var(--dev-ink, var(--accent)); }
.saved { font-size: 14px; color: var(--positive); min-height: 20px; margin: 0; }

/* tests */
.ht-stage { display: grid; gap: 16px; margin-top: 12px; }
.ht-now { font-size: 22px; font-weight: 600; line-height: 1.2; }
.ht-big { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ht-big .btn { min-height: 64px; font-size: 16px; }
.progress { height: 6px; border-radius: 3px; background: var(--neutral-soft); overflow: clip; }
.progress i { display: block; height: 100%; background: var(--dev-mark, var(--accent)); transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform .4s var(--ease-out); }
.ht-chart { width: 100%; height: 160px; display: block; }
.ht-chart .grid { stroke: var(--rule); stroke-width: 1; }
.ht-chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.ht-chart .l { fill: none; stroke: var(--dev-mark, var(--accent)); stroke-width: 2.5; }
.ht-chart .r { fill: none; stroke: var(--text); stroke-width: 2.5; stroke-dasharray: 6 4; }
.ab-round { font-size: 22px; font-weight: 600; }
.ab-on { outline: 2px solid var(--dev-mark, var(--accent)); outline-offset: -2px; }
.select { min-height: 44px; padding: 0 12px; border: 1px solid var(--control); border-radius: var(--radius-inner); background: var(--surface); color: var(--text); font: inherit; }
.ab-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ab-pick label { display: grid; gap: 4px; font-size: 14px; font-weight: 500; }

/* desktop: rail + two columns */
@container (min-width: 700px) {
  .set-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr); gap: 32px; }
  .split.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); }
  .split.wide { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
  .shell { grid-template-columns: 64px minmax(0, 1fr); grid-template-rows: none; }
  .nav { grid-column: 1; grid-row: 1; grid-template-columns: none; grid-auto-rows: 52px; align-content: start; gap: 8px; border-top: 0; border-right: 1px solid var(--rule); padding: 16px 6px; }

  const d = DEVICES[current], all = HT.res.flat(), best = Math.min(...all);
  const idx = { 250: 3, 1000: 5, 4000: 7, 8000: 8 };
  HT_FREQS.forEach((f, i) => { d.gains[idx[f]] = clamp(Math.round(((HT.res[0][i] + HT.res[1][i]) / 2 - best) / 3 * 2) / 2, 0, 6); });
  const avgL = HT.res[0].reduce((a, b) => a + b) / 4, avgR = HT.res[1].reduce((a, b) => a + b) / 4;
  d.bal = clamp(Math.round((avgL - avgR) / 4 * 2) / 2, -6, 6);
  d.profile = 'Hearing fit'; d.note = 'From your hearing test';
  renderAll();
}

// Blind A/B: X and Y are the two profiles in a random order each round.
const PROFILES = ['Harman fix', 'Flat', 'Loudness'];
const AB = { state: 'idle', a: 'Harman fix', b: 'Flat', round: 0, total: 6, xIsA: [], picks: [], on: null };
function abStart() {
  Object.assign(AB, { state: 'run', round: 0, picks: [], on: null, xIsA: Array.from({ length: AB.total }, () => Math.random() < 0.5) });
  renderAll();
}
function abPick(x) {
  AB.picks.push(x === AB.xIsA[AB.round] ? AB.a : AB.b);
  AB.round++; AB.on = null;
  if (AB.round === AB.total) AB.state = 'done';
  renderAll();
}

function mount(host, prefix) {
  const frag = document.getElementById('app-tpl').content.cloneNode(true);
  frag.querySelectorAll('[id]').forEach(el => { el.id = `${prefix}-${el.id}`; });
  frag.querySelectorAll('[aria-labelledby]').forEach(el => el.setAttribute('aria-labelledby', `${prefix}-${el.getAttribute('aria-labelledby')}`));
  frag.querySelectorAll('label[for]').forEach(el => el.htmlFor = `${prefix}-${el.htmlFor}`);
  host.append(frag);
  const app = host.querySelector('.app');
  const f = n => app.querySelector(`[data-f="${n}"]`);
  const navInd = app.querySelector('.nav-ind');
  const placeNav = () => {
    const btn = app.querySelector('.nav-btn[aria-current="page"]');
    const rail = app.querySelector('.nav').offsetWidth < 100;
    navInd.style.width = rail ? '' : btn.offsetWidth + 'px';
    navInd.style.transform = rail ? `translateY(${btn.offsetTop}px)` : `translateX(${btn.offsetLeft}px)`;
  };
  const placeSegs = () => app.querySelectorAll('.seg').forEach(seg => {
    const on = seg.querySelector('[aria-checked="true"]'), ind = seg.querySelector('.seg-ind');
    if (!on || !on.offsetWidth) return;
    ind.style.width = on.offsetWidth + 'px'; ind.style.transform = `translateX(${on.offsetLeft - 4}px)`;
  });
  const go = name => {
    app.querySelectorAll('.nav-btn').forEach(b => b.dataset.go === name ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
    app.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.dataset.view === name));
    app.querySelector('.screen').scrollTop = 0;
    placeNav(); placeSegs();
  };

  // EQ sliders, built once
  f('eq').innerHTML = BANDS.map((hz, i) => `<label class="band"><output data-out="${i}">0</output><input type="range" min="-12" max="12" step="0.5" data-band="${i}" aria-label="${fmtHz(hz)}Hz gain"><span>${fmtHz(hz)}</span></label>`).join('');

  app.addEventListener('click', e => {
    const t = e.target;
    const g = t.closest('[data-go]');
    if (g) { if (g.dataset.sel) selected = +g.dataset.sel; go(g.dataset.go); renderAll(); }
    if (t.closest('[data-act="announce"]')) connectAll(true);
    if (t.closest('[data-act="play-words"]')) say(announcement(DEVICES[current]));
    if (t.closest('[data-act="setup"]')) { selected = current; go('devices'); renderAll(); }
    if (t.closest('[data-act="finish-setup"]')) { const d = DEVICES[selected]; d.isNew = false; d.note = 'Set up today'; d.last = 'Now'; renderAll(); if (selected === current) say(announcement(d)); }
    if (t.closest('[data-act="forget"]')) { f('forgetmsg').textContent = `${DEVICES[selected].name} and its sound settings will be removed. It is set up again the next time it connects.`; f('forget').showModal(); }
    if (t.closest('[data-act="flat"]')) { const d = DEVICES[current]; d.gains = d.gains.map(() => 0); d.profile = 'Flat'; d.note = 'Reset by hand'; renderAll(); }
    const ae = t.closest('[data-ae]');
    if (ae) { const m = AUTOEQ[+ae.dataset.ae], d = DEVICES[current]; d.gains = [...m.gains]; d.profile = `AutoEq: ${m.model}`; d.note = 'AutoEq match, saved today'; renderAll(); }
    if (t.closest('dialog button[value="forget"]')) {
      DEVICES.splice(selected, 1);
      if (current > selected) current--;
      selected = current; renderAll();
    }
    const hue = t.closest('[data-hue]');
    if (hue) {
      DEVICES[selected].hue = hue.dataset.hue;
      hue.parentElement.querySelectorAll('[data-hue]').forEach(x => x.setAttribute('aria-checked', x === hue));
      renderAll();
    }
    const bc = t.closest('[data-bc]');
    if (bc) {
      const d = DEVICES[current], dir = +bc.dataset.bc;
      if (dir === 0) f('bcmsg').textContent = `Saved. ${balText(d.bal)}.`;
      else { d.bal = clamp(d.bal - dir * 0.5, -6, 6); f('bcmsg').textContent = `${balText(d.bal)}. Listen again.`; tone(1000, -24, clamp(d.bal / 6, -1, 1)); }
      renderAll();
    }
    if (t.closest('[data-ht="start"]')) { Object.assign(HT, { state: 'run', ear: 0, fi: 0, level: -20, heard: null, res: [[], []] }); htPlay(); }
    if (t.closest('[data-ht="yes"]')) htAnswer(true);
    if (t.closest('[data-ht="no"]')) htAnswer(false);
    if (t.closest('[data-ht="replay"]')) htPlay();
    if (t.closest('[data-ht="stop"]')) { HT.state = HT.res[1].length === 4 ? 'done' : 'idle'; renderAll(); }
    if (t.closest('[data-ht="apply"]')) htApply();
    if (t.closest('[data-ab="start"]')) abStart();
    const abp = t.closest('[data-abplay]');
    if (abp) { AB.on = abp.dataset.abplay; renderAll(); }
    const abk = t.closest('[data-abpick]');
    if (abk) abPick(abk.dataset.abpick === 'x');
    if (t.closest('[data-ab="keep"]')) { const d = DEVICES[current]; d.profile = winner(); d.note = 'Chosen in a blind A/B'; AB.state = 'idle'; renderAll(); }
    const pick = t.closest('[data-voice]');
    if (pick) {
      VOICE.pick = pick.dataset.voice; save('voice', VOICE.pick); renderVoice();
      if (pick.classList.contains('play-btn')) say(`Connected to ${DEVICES[current].name}.`, pick.dataset.voice);
    }
    const r = t.closest('[role="radio"]');
    if (r && !r.dataset.hue) {
      r.parentElement.querySelectorAll('[role="radio"]').forEach(x => x.setAttribute('aria-checked', x === r));
      if (r.dataset.themePick) setTheme(r.dataset.themePick);
      placeSegs();
    }
  });
  app.addEventListener('input', e => {
    const t = e.target, d = DEVICES[current];
    if (t.dataset.band) { d.gains[+t.dataset.band] = +t.value; edited(d); renderAll(); }
    if (t === f('tbal')) { d.bal = +t.value; renderAll(); }
    if (t === f('aeq')) renderTune();
    if (t.dataset.rename !== undefined) { DEVICES[selected].name = t.value || 'Unnamed device'; renderAll(); }
    if (t === f('words')) apps.forEach(a => { if (a.f('words') !== t) a.f('words').value = t.value; });
    if (t.dataset.abside) { AB[t.dataset.abside] = t.value; renderAll(); app.querySelector('[data-ab="start"]')?.toggleAttribute('disabled', AB.a === AB.b); }
  });
  app.addEventListener('change', e => {
    const t = e.target, d = DEVICES[current];
    if (t.matches('[data-motion-toggle]')) setMotion(t.checked);
    if (t === f('tsur')) { d.sur = t.checked; renderAll(); }
    if (t === f('txf')) { d.xf = t.checked; renderAll(); }
    if (t.dataset.announce !== undefined) { DEVICES[selected].announce = t.checked; renderAll(); }
  });
  new ResizeObserver(() => { placeNav(); placeSegs(); }).observe(app);

  let ready = false;
  const setHue = (el, d) => { for (const k of ['soft', 'ink', 'mark']) el.style.setProperty(`--dev-${k}`, d ? `var(--${d.hue}-${k})` : ''); };
  const devRow = (x, i, mode) => `<li><button class="devrow" type="button" data-go="devices" data-sel="${i}" aria-current="${mode === 'select' && i === selected}"><span class="tile" style="background:var(--${x.hue}-soft);color:var(--${x.hue}-ink)" aria-hidden="true">${x.name.replace(/^.*'s /, '')[0]}</span><span><strong>${x.name}</strong><span>${x.isNew ? 'Not set up' : x.profile}</span></span>${x.isNew ? '<span class="new-tag">New</span>' : `<span class="${i === current && ready ? 'now' : ''}">${i === current ? (ready ? 'Connected' : 'Checking') : x.last}</span>`}</button></li>`;
  const keep = el => el && el.contains(document.activeElement) && document.activeElement.matches('input, select, textarea');

  const renderNow = () => {
    const d = DEVICES[current];
    app.dataset.state = ready ? 'ready' : 'searching';
    setHue(app, ready && d);
    f('icon').innerHTML = ready ? ICONS[d.icon] : ICONS.buds;
    f('route').textContent = ready ? d.route : 'Looking for an output';
    f('name').textContent = ready ? d.name : 'Checking outputs';
    if (app.dataset.speaking !== 'true') f('state').textContent = ready ? stateText() : 'Bluetooth, USB and the headphone jack';
    f('profile').textContent = ready ? d.profile : 'None yet';
    f('note').textContent = ready ? d.note : '';
    f('curve').setAttribute('d', ready ? gainsPath(d.gains) : 'M0 48 L300 48');
    f('bal').style.setProperty('--bal', ready ? d.bal * 7 + 'px' : '0px');
    f('balval').textContent = ready ? balText(d.bal) : 'Balance centered';
    f('hw').hidden = ready && !d.hw;
    f('setup').hidden = !(ready && d.isNew);
    f('setupname').textContent = `New output: ${d.name}`;
    f('battery').innerHTML = !ready ? '' : d.battery
      ? ['Left', 'Right'].map((s, i) => { const v = i ? d.battery.r : d.battery.l; return `<div class="batt">${s}<b>${v}%</b><div class="meter"><i style="--v:${v / 100}"></i></div></div>`; }).join('')
      : `<div class="battery-none">${d.kind}. No battery to report.</div>`;
    f('list').innerHTML = DEVICES.map((x, i) => devRow(x, i, 'now')).join('');
  };
  const renderDevices = () => {
    f('dlist').innerHTML = DEVICES.map((x, i) => devRow(x, i, 'select')).join('');
    const d = DEVICES[selected], det = f('detail');
    setHue(det, d);
    if (keep(det) && det.dataset.for === d.id + d.isNew) return;
    det.dataset.for = d.id + d.isNew;
    det.innerHTML = `
      <h2>${d.isNew ? 'Set up this device' : d.name}</h2>
      <p class="muted">${d.kind}. ${d.isNew ? 'Found just now. It plays flat until you finish.' : `Last connected: ${d.last}.`}</p>
      <label class="field-label" for="${prefix}-rn">Name</label>
      <input class="field" id="${prefix}-rn" data-rename value="${d.name.replace(/"/g, '&quot;')}">
      <div class="field-label" id="${prefix}-hl">Color</div>
      <div class="swatches" role="radiogroup" aria-labelledby="${prefix}-hl">${HUES.map(([h, n]) => `<button type="button" class="swatch" role="radio" data-hue="${h}" aria-checked="${d.hue === h}" aria-label="${n}" style="background:var(--${h}-mark);color:var(--${h}-mark)"></button>`).join('')}</div>
      <div class="field-label">Sound</div>
      <p class="muted">${d.isNew ? 'Find its model in AutoEq on the Tune screen, or keep it flat.' : `${d.profile}. ${d.note}.`}</p>
      <label class="switch-row"><span><strong>Announce when connected</strong><small>Speaks its name and sound profile</small></span><input class="switch" type="checkbox" role="switch" data-announce ${d.announce ? 'checked' : ''}></label>
      <div class="btn-row">${d.isNew ? `<button class="btn primary" type="button" data-act="finish-setup">Save this device</button>` : ''}<button class="btn" type="button" data-go="tune" ${selected === current ? '' : 'disabled title="Connect this device to tune it"'}>Tune</button><button class="btn danger" type="button" data-act="forget" ${selected === current ? 'disabled title="Disconnect it first"' : ''}>Forget</button></div>
      ${selected === current ? '' : '<p class="muted">Connect this device to tune it.</p>'}`;
  };
  const renderTune = () => {
    const d = DEVICES[current];
    f('tchip').innerHTML = `<b aria-hidden="true">${ICONS[d.icon]}</b>${d.name}`;
    f('tprofile').textContent = d.profile;
    f('tcurve').setAttribute('d', gainsPath(d.gains));
    app.querySelectorAll('[data-band]').forEach(inp => { const i = +inp.dataset.band; if (document.activeElement !== inp) inp.value = d.gains[i]; app.querySelector(`[data-out="${i}"]`).textContent = (d.gains[i] > 0 ? '+' : '') + d.gains[i]; });
    const top = Math.max(0, ...d.gains);
    f('preamp').textContent = top > 0 ? `Preamp ${-top} dB, so the loudest boost cannot clip.` : 'No preamp needed. Nothing is boosted.';
    if (document.activeElement !== f('tbal')) f('tbal').value = d.bal;
    f('tbalval').textContent = balText(d.bal);
    f('tsur').checked = d.sur; f('txf').checked = d.xf;
    const q = f('aeq').value.trim().toLowerCase();
    const hits = q ? AUTOEQ.map((m, i) => [m, i]).filter(([m]) => m.model.toLowerCase().includes(q)) : AUTOEQ.map((m, i) => [m, i]).slice(0, 3);
    f('aeres').innerHTML = hits.length ? hits.map(([m, i]) => `<li><button class="result" type="button" data-ae="${i}"><span><strong>${m.model}</strong><small>${m.src}</small></span><em>Apply</em></button></li>`).join('')
      : `<li class="muted">No AutoEq entry matches “${f('aeq').value}”. Check the model name, or tune by hand above.</li>`;
  };
  const renderTests = () => {
    const ht = f('ht'), d = DEVICES[current];
    if (HT.state === 'idle') ht.innerHTML = `
      <p class="muted">Short tones play in one ear at a time, getting quieter. Answer whether you heard each one. About three minutes, quiet room.</p>
      <p class="muted">No result yet for ${d.name}.</p>
      <div class="btn-row"><button class="btn primary" type="button" data-ht="start">Start the test</button></div>`;
    else if (HT.state === 'run') {
      const step = HT.ear * HT_FREQS.length + HT.fi;
      ht.innerHTML = `
        <div class="progress" aria-hidden="true"><i style="--p:${step / (HT_FREQS.length * 2)}"></i></div>
        <div><div class="ht-now">${HT.ear ? 'Right' : 'Left'} ear, ${fmtHz(HT_FREQS[HT.fi])}Hz</div><p class="muted">Tone ${step + 1} of ${HT_FREQS.length * 2}. Did you hear it?</p></div>
        <div class="ht-big"><button class="btn primary" type="button" data-ht="yes">I heard it</button><button class="btn" type="button" data-ht="no">I did not</button></div>
        <div class="btn-row"><button class="btn" type="button" data-ht="replay">Play again</button><button class="btn" type="button" data-ht="stop">Stop</button></div>`;
    } else {
      const y = v => 20 + (-v - 10) * 1.6, x = i => 40 + i * 80;
      const line = r => r.map((v, i) => `${x(i)},${y(v)}`).join(' ');
      ht.innerHTML = `
        <p class="muted">Quietest tone you heard, per ear. Lower on the chart is better hearing.</p>
        <svg class="ht-chart" viewBox="0 0 320 160" role="img" aria-label="Hearing thresholds: left ${HT.res[0].join(', ')} dB, right ${HT.res[1].join(', ')} dB">
          ${[-20, -40, -60].map(v => `<line class="grid" x1="30" x2="300" y1="${y(v)}" y2="${y(v)}"/><text x="0" y="${y(v) + 4}">${v}</text>`).join('')}
          ${HT_FREQS.map((hz, i) => `<text x="${x(i) - 10}" y="156">${fmtHz(hz)}</text>`).join('')}
          <polyline class="l" points="${line(HT.res[0])}"/><polyline class="r" points="${line(HT.res[1])}"/>
          <text x="${x(3) + 6}" y="${y(HT.res[0][3]) - 6}">Left</text><text x="${x(3) + 6}" y="${y(HT.res[1][3]) + 14}">Right</text>
        </svg>
        <div class="btn-row"><button class="btn primary" type="button" data-ht="apply">Apply to ${d.name}</button><button class="btn" type="button" data-ht="start">Take it again</button></div>`;
    }
    const ab = f('ab');
    if (keep(ab)) return;
    const opts = side => PROFILES.map(p => `<option ${AB[side] === p ? 'selected' : ''}>${p}</option>`).join('');
    if (AB.state === 'idle') ab.innerHTML = `
      <p class="muted">Play music in any app. X and Y switch your sound between two profiles without saying which is which.</p>
      <div class="ab-pick"><label>First<select class="select" data-abside="a">${opts('a')}</select></label><label>Second<select class="select" data-abside="b">${opts('b')}</select></label></div>
      <div class="btn-row"><button class="btn primary" type="button" data-ab="start" ${AB.a === AB.b ? 'disabled' : ''}>Start, ${AB.total} rounds</button></div>`;
    else if (AB.state === 'run') ab.innerHTML = `
      <div class="ab-round">Round ${AB.round + 1} of ${AB.total}</div>
      <div class="ab-pick"><button class="btn ${AB.on === 'x' ? 'ab-on' : ''}" type="button" data-abplay="x" aria-pressed="${AB.on === 'x'}">Listen to X</button><button class="btn ${AB.on === 'y' ? 'ab-on' : ''}" type="button" data-abplay="y" aria-pressed="${AB.on === 'y'}">Listen to Y</button></div>
      <div class="ab-pick"><button class="btn primary" type="button" data-abpick="x">I prefer X</button><button class="btn primary" type="button" data-abpick="y">I prefer Y</button></div>
      <p class="muted">In the app, X and Y change your system sound. This mockup shows the flow only.</p>`;
    else ab.innerHTML = `
      <div class="ab-round">You picked ${winner()}</div>
      <p class="muted">${winner()} won ${AB.picks.filter(p => p === winner()).length} of ${AB.total} rounds.</p>
      <div class="btn-row"><button class="btn primary" type="button" data-ab="keep">Use ${winner()} on ${d.name}</button><button class="btn" type="button" data-ab="start">Run it again</button></div>`;
  };
  const renderVoiceHere = () => {
    f('eprog').textContent = VOICE.status;
    f('eprog').hidden = !VOICE.status;
    f('voices').innerHTML = VOICES.map(([id, name, desc]) => `<li class="voice" aria-current="${id === VOICE.pick}"><button class="voice-pick" type="button" data-voice="${id}"><strong>${name}</strong><span>${desc}</span></button><button class="play-btn" type="button" data-voice="${id}" aria-label="Preview ${name}">Play</button></li>`).join('');
  };
  const api = {
    f, placeSegs, renderVoice: renderVoiceHere,
    speaking: v => { app.dataset.speaking = v; },
    ready: () => ready,
    setReady: v => { ready = v; },
    render: () => { renderNow(); renderDevices(); renderTune(); renderTests(); },
  };
  apps.push(api);
  api.render();
}
const winner = () => { const a = AB.picks.filter(p => p === AB.a).length; return a * 2 >= AB.total ? AB.a : AB.b; };
function renderAll() {
  // keep keyboard focus on the same control after a re-render
  const a = document.activeElement, frame = a?.closest?.('.frame');
  const key = a && ['ht', 'ab', 'abplay', 'abpick', 'bc', 'ae', 'hue', 'sel', 'act', 'go'].map(k => a.dataset?.[k] !== undefined ? `[data-${k}="${a.dataset[k]}"]` : '').find(Boolean);
  apps.forEach(x => x.render());
  if (frame && key && !frame.contains(a)) frame.querySelector(key)?.focus({ preventScroll: true });
}

let timer;
function connectAll(speak) {
  clearTimeout(timer);
  apps.forEach(a => { a.setReady(false); a.render(); });
  timer = setTimeout(() => {
    apps.forEach(a => { a.setReady(true); a.render(); });
    if (speak && DEVICES[current].announce) say(announcement(DEVICES[current]));
  }, document.documentElement.dataset.motion === 'off' ? 0 : 1500);
}

const THEMES = ['light', 'dark', 'system'];
let themeChoice = read('theme', 'light');
const dark = matchMedia('(prefers-color-scheme: dark)');
function setTheme(choice) {
  themeChoice = choice; save('theme', choice);
  document.documentElement.dataset.theme = choice === 'system' ? (dark.matches ? 'dark' : 'light') : choice;
  document.getElementById('theme').textContent = 'Theme: ' + choice[0].toUpperCase() + choice.slice(1);
  document.querySelectorAll('[data-theme-pick]').forEach(b => b.setAttribute('aria-checked', b.dataset.themePick === choice));
  apps.forEach(a => a.placeSegs());
}
dark.addEventListener('change', () => themeChoice === 'system' && setTheme('system'));
function setMotion(on) {
  document.documentElement.dataset.motion = on ? 'on' : 'off';
  const b = document.getElementById('motion'); b.setAttribute('aria-pressed', on); b.textContent = on ? 'Motion on' : 'Motion off';
  document.querySelectorAll('[data-motion-toggle]').forEach(c => { c.checked = on; });
}

mount(document.getElementById('phone'), 'p');
mount(document.getElementById('desk'), 'd');
setTheme(themeChoice);
renderVoice();
connectAll(false);
document.getElementById('replay').onclick = () => connectAll(true);
document.getElementById('next').onclick = () => { current = (current + 1) % DEVICES.length; selected = current; connectAll(true); };
document.getElementById('theme').onclick = () => setTheme(THEMES[(THEMES.indexOf(themeChoice) + 1) % 3]);
document.getElementById('motion').onclick = () => setMotion(document.documentElement.dataset.motion !== 'on');
</script>
</body>
</html>
