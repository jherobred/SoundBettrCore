[package]
name = "soundbettrcore"
version = "0.1.0"
description = "Anker Soundcore R50i NC (A3959) spatial audio DSP rack, Harman target EQ, Dolby dynamic leveler, and direct Bluetooth controller."
authors = ["Jhems"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon", "image-png", "protocol-asset", "unstable"] }
tauri-plugin-autostart = "2.6"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-opener = "2.6"
tauri-plugin-single-instance = "2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Devices_Bluetooth",
  "Win32_Networking_WinSock",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
