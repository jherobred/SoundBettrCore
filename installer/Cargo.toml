[package]
name = "soundbettrcore-setup"
version = "0.1.0"
description = "SoundBettrCore Windows Setup Installer and EqualizerAPO Configurator"
authors = ["Jhems"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Devices_Bluetooth",
  "Win32_Networking_WinSock",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
